name: Build APK
on:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y openjdk-17-jdk zip
      - name: Build APK
        run: buildozer android debug
      - name: Upload APK
        uses:     - name: Upload APK
      uses: actions/upload-artifact@v4
        with:
          name: Chandni-VPN-APK
          path: bin/*.apk